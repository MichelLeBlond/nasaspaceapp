steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nasaspaceapp-image:latest'
      - '.'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nasaspaceapp-image:latest'

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nasaspaceapp' # <-- Your Cloud Run service name
      - '--image=us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/nasaspaceapp-image:latest'
      - '--region=us-west1' # <-- Your service region
      - '--platform=managed'
      - '--allow-unauthenticated'

options:
  # This tells Cloud Build to send logs to Cloud Logging instead of a GCS bucket.
  logging: CLOUD_LOGGING_ONLY
